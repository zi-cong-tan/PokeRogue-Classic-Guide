      - generic [ref=f9e3998]:
        - heading "Candy and eggs" [level=2] [ref=f9e3999]
        - paragraph [ref=f9e4000]: Catch or hatch a starter's line and that starter earns candy.
        - paragraph [ref=f9e4001]: Spend it on a passive ability, two cost drops or an egg of the same species. Cheaper starters need more candy for the same upgrade, so your 3-cost favourites take longest to power up.
