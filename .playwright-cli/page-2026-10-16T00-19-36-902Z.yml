    - region [ref=f4e4231]:
      - heading "Things worth knowing" [level=2] [ref=f4e4232]
      - generic [ref=f4e4233]:
        - paragraph [ref=f4e4234]:
          - strong [ref=f4e4235]: When do bosses show up?
          - text: Every wave that ends in 0. A boss closes out each biome, and your team is fully healed when the biome changes, so spend healing items freely just before a 0 wave.
        - paragraph [ref=f4e4236]:
          - strong [ref=f4e4237]: When are the gym leaders?
          - text: The first is on wave 20 or 30, decided by the run, then one every 30 waves. Normal trainers never spawn within two waves of a fixed fight.
        - paragraph [ref=f4e4238]:
          - strong [ref=f4e4239]: What should I save money for?
          - text: "Waves 182 to 200: four Elite Four members, the Champion, your rival and Eternatus, nearly back to back. You will buy more healing there than in the rest of the run."
        - paragraph [ref=f4e4240]:
          - strong [ref=f4e4241]: Is the Map worth taking?
          - text: Yes, early. Without one the next biome is random. With one you choose between the open links and can route toward the Pokemon you still need.
        - paragraph [ref=f4e4242]:
          - strong [ref=f4e4243]: What makes a run worth it?
          - text: New species, not wins. Each new line becomes a starter and pays candy. A run that ends on wave 60 with eight new lines still moved your account forward.
        - paragraph [ref=f4e4244]:
          - strong [ref=f4e4245]: How do I beat Eternatus?
          - text: "It is Poison and Dragon, so Ground, Psychic, Ice and Dragon moves hit it for double. It is very bulky: bring stat boosts or status, not just raw power."
        - paragraph [ref=f4e4246]:
          - strong [ref=f4e4247]: How is Endless different?
          - text: You get 15 starter points instead of 10, bosses come every 50 waves, and Eternatus returns every 250th wave.
        - paragraph [ref=f4e4248]:
          - strong [ref=f4e4249]: Why do cheap starters level so slowly?
          - text: "Candy prices run the other way: a 1-cost starter needs 40 candy for its passive, a 9-cost one only 10. Catch plenty of the cheap lines you like."
        - paragraph [ref=f4e4250]:
          - strong [ref=f4e4251]: Which types does the team check use?
          - text: Each starter's first-stage types. A starter that evolves can change type, so check again once your team is built out.
